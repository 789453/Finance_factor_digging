job_id: a_share_pv_ts_2020_2021
name: "A股价格-成交量时序因子挖掘2020-2021"

dataset_id: cn.stock.daily.v1
dataset_meta: config/datasets/cn_stock_daily_v1.yaml
family_id: pv_ts_core
family_spec: config/factor_families/pv_ts_core.yaml

segment_name: "2020_2021"
train_start: "20200101"
train_end: "20201231"
test_start: "20210101"
test_end: "20211231"

n_episodes: 15000
batch_size: 32
pool_capacity: 100
encoder_type: "gnn"
entropy_coef: 0.01
ssl_weight: 1.0
nov_weight: 0.3

layers: [raw, atomic]
read_mode: stack
status_filter: [active, watch]

entry_strategy: diversity_aware
min_ic_threshold: 0.03
max_similarity_threshold: 0.90
diversity_weight: 0.30

cache_root: data/cache
output_dir: runs/a_share_pv_ts_2020_2021
seed: 42
cuda: 0

logging:
  log_freq: 100
  checkpoint_freq: 1000
  export_candidate_freq: 1000
