# 价格-成交量时序核心因子族配置
family_id: pv_ts_core
enabled_layers: [raw, atomic]
allowed_domains: [A]
allowed_freq_groups: [eod]

# 操作符白名单
operator_whitelist:
  - Ref
  - TsMean
  - TsStd
  - TsRank
  - TsDelta
  - TsCorr
  - TsCov
  - Add
  - Sub
  - Mul
  - Div
  - Rank

# 禁止的操作符
forbid_operators: [Greater, Less, Pow]

# 时间窗口参数
delta_times: [5, 10, 20, 40, 60]

# 常数参数
constants: [0.5, 1.0, 2.0]

# 表达式约束
max_expr_length: 18
min_ts_operator_count: 1

# 特征范围定义
feature_scopes:
  raw:
    - open
    - high
    - low
    - close
    - vwap
    - amount
    - volume
    - turnover
  atomic:
    - ret_5
    - ret_10
    - ret_20
    - vwap_dev
    - amount_z20
    - volume_z20
    - turnover_z20
    - corr_close_volume_20
    - corr_ret_amount_20
    - hl_spread
    - oc_gap

# 采样和池配置
sample_budget: 20000
pool_capacity: 200

# 训练参数
n_episodes: 10000
entropy_coef: 0.01
entropy_temperature: 1.0
ssl_weight: 1.0
nov_weight: 0.3
weight_decay_type: linear
final_weight_ratio: 0.0

# 数据过滤
status_filter: [active, watch]

# 评估参数
label_days: 10
max_backtrack_days: 100
max_future_days: 30