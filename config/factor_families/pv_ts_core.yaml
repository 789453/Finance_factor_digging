family_id: pv_ts_core
name: Price Volume Time-Series Core
description: 基于量价字段的时序搜索空间

allowed_domains: [A, FUT, IDX, FX]
allowed_freq_groups: [eod]
enabled_layers: [raw, atomic]

feature_scopes:
  - domain: A
    layers: [raw, atomic]
    include:
      - open
      - high
      - low
      - close
      - volume
      - amount
      - ret_1
      - ret_5
      - hl_range
      - vwap_dev
  - domain: FUT
    layers: [raw, atomic]
    include:
      - open
      - high
      - low
      - close
      - settle
      - volume
      - open_interest
      - oi_chg_1

operator_whitelist:
  - Ref
  - TsMean
  - TsStd
  - TsRank
  - TsDelta
  - TsCorr
  - TsCov
  - Add
  - Sub
  - Mul
  - Div
  - Rank

forbid_operators:
  - Pow
  - Sin
  - Cos

delta_times: [3, 5, 10, 20, 40, 60]
constants: [0.5, 1.0, 2.0, 3.0]

constraints:
  max_expr_length: 20
  max_ast_depth: 8
  allow_cross_domain: false
  allow_future_ref: false
  min_feature_coverage: 0.65
