family_id: moneyflow_ts_complex
name: Moneyflow Time-Series Complex
allowed_domains: [A]
allowed_freq_groups: [eod]
enabled_layers: [raw, atomic]

feature_scopes:
  raw:
    - buy_sm_amount
    - sell_sm_amount
    - buy_md_amount
    - sell_md_amount
    - buy_lg_amount
    - sell_lg_amount
    - buy_elg_amount
    - sell_elg_amount
    - net_mf_amount
    - net_mf_vol
  atomic:
    - mf_imbalance_lg
    - mf_imbalance_elg
    - mf_net_ratio
    - mf_pressure
    - mf_acceleration

operator_whitelist:
  - Ref
  - TsMean
  - TsStd
  - TsRank
  - TsDelta
  - TsCorr
  - TsCov
  - Add
  - Sub
  - Mul
  - Div
  - Rank

forbid_operators:
  - Pow
  - Greater
  - Less

delta_times: [3, 5, 10, 20, 40, 60]
constants: [0.5, 1.0, 2.0, 3.0]

constraints:
  max_expr_length: 24
  min_expr_length: 4
  min_complexity: 4
  min_depth: 3
  min_operators: 2
  min_ts_operator_count: 1
  min_feature_count: 1
  min_feature_coverage: 0.65
  reject_constant_only: true
  reject_raw_feature_only: true
  reject_single_ref: true
  reject_identity: true
